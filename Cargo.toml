[workspace]
members = ["crates/invoice-collect", "crates/invoice-parse", "crates/invoice-grouping", "crates/invoice-store", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
imap = "3.0.0-alpha.15"
mail-parser = "0.9"
rust_decimal = { version = "1.36", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
zip = "2.2"
dirs = "6.0"
zeroize = "1.9"
url = "2.5"

# Windows product validation needs source-line backtraces, not retained
# variable-level debug state or unbounded incremental caches.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
