name: Windows quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # windows-2025 can start below the repository's 20 GiB free-space gate.
    # Pin the release baseline to Windows Server 2022 instead of weakening it.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The hosted Windows workspace is small. A single codegen unit keeps
      # all-target Clippy/test object output bounded without reducing coverage.
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application version files agree
        shell: pwsh
        run: .\scripts\assert-release-version.ps1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --prefix ui

      - name: Install locked Rust toolchain components
        shell: pwsh
        run: rustup toolchain install 1.97.1 --component rustfmt --component clippy

      - name: Verify build storage capacity
        shell: pwsh
        run: .\scripts\check-build-storage.ps1 -Mode Preflight -AutoCleanDev -MinimumFreeGiB 8 -EvidencePath artifacts/build-storage-preflight.validation.json

      - name: Test build storage guard
        shell: pwsh
        run: .\scripts\test-build-storage-gate.ps1

      - name: Scan repository secrets
        shell: pwsh
        run: .\scripts\scan-secrets.ps1

      - name: Test secret scanner
        shell: pwsh
        run: .\scripts\test-secret-scan.ps1

      - name: Verify synthetic fixture inventory
        shell: pwsh
        run: .\scripts\scan-private-fixtures.ps1 -SelfTest

      - name: Test update manifest policy
        shell: pwsh
        run: .\scripts\test-update-manifest-config.ps1

      - name: Test Concur build gate
        shell: pwsh
        run: .\scripts\test-concur-send-build-gate.ps1

      - name: Verify third-party licenses
        shell: pwsh
        run: .\scripts\check-third-party-licenses.ps1

      - name: Test release version tooling
        shell: pwsh
        run: .\scripts\test-release-version.ps1

      # Tauri's generate_context! macro validates frontendDist during Rust
      # compilation, so a clean checkout must build ui/dist first.
      - name: Check UI types and Svelte diagnostics
        working-directory: ui
        run: npm run check

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        shell: pwsh
        run: .\scripts\run-ci-clippy.ps1

      - name: Check Rust workspace
        shell: pwsh
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --workspace --all-targets --locked

      - name: Test forced OCR image path
        shell: pwsh
        run: cargo test -p invoice-parse offline_ocr_reads_synthetic_vat_invoice --locked -- --ignored

      - name: Test forced scanned PDF OCR path
        shell: pwsh
        run: cargo test -p invoice-parse scanned_pdf_ocr_reads_synthetic_vat_invoice --locked -- --ignored

      # Build this only when the process integration test needs the standalone
      # executable. Building it before Clippy retains a second set of normal
      # dev artifacts and can exhaust the hosted Windows runner's workspace.
      - name: Build OCR worker
        shell: pwsh
        run: cargo build -p invoice-parse --bin invoice-ocr-worker --locked

      - name: Test production OCR worker roundtrip
        shell: pwsh
        run: cargo test -p invoice-assistant --test ocr_worker_process production_worker_roundtrips_image_and_scanned_pdf --locked -- --ignored --exact

      - name: Verify post-build storage reserve
        shell: pwsh
        run: .\scripts\check-build-storage.ps1 -Mode Postflight -AutoCleanDev -MinimumFreeGiB 8 -EvidencePath artifacts/build-storage-postflight.validation.json
