name: Windows quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # windows-2025 can start below the repository's 20 GiB free-space gate.
    # Pin the release baseline to Windows Server 2022 instead of weakening it.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application version files agree
        shell: pwsh
        run: .\scripts\assert-release-version.ps1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --prefix ui

      - name: Install locked Rust toolchain components
        shell: pwsh
        run: rustup toolchain install 1.97.1 --component rustfmt --component clippy

      - name: Run the same Windows quality gate as local development
        shell: pwsh
        run: .\scripts\verify-windows.ps1 -MinimumFreeGiB 8
