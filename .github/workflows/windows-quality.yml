name: Windows quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # windows-2025 can start below the repository's 20 GiB free-space gate.
    # Pin the release baseline to Windows Server 2022 instead of weakening it.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application version files agree
        shell: pwsh
        run: .\scripts\assert-release-version.ps1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --prefix ui

      - name: Install locked Rust toolchain components
        shell: pwsh
        run: rustup toolchain install 1.97.1 --component rustfmt --component clippy

      - name: Verify build storage capacity
        shell: pwsh
        run: .\scripts\check-build-storage.ps1 -Mode Preflight -AutoCleanDev -MinimumFreeGiB 8 -EvidencePath artifacts/build-storage-preflight.validation.json

      - name: Test build storage guard
        shell: pwsh
        run: .\scripts\test-build-storage-gate.ps1

      - name: Scan repository secrets
        shell: pwsh
        run: .\scripts\scan-secrets.ps1

      - name: Test secret scanner
        shell: pwsh
        run: .\scripts\test-secret-scan.ps1

      - name: Verify synthetic fixture inventory
        shell: pwsh
        run: .\scripts\scan-private-fixtures.ps1 -SelfTest

      - name: Test update manifest policy
        shell: pwsh
        run: .\scripts\test-update-manifest-config.ps1

      - name: Test Concur build gate
        shell: pwsh
        run: .\scripts\test-concur-send-build-gate.ps1

      - name: Verify third-party licenses
        shell: pwsh
        run: .\scripts\check-third-party-licenses.ps1

      - name: Test release version tooling
        shell: pwsh
        run: .\scripts\test-release-version.ps1

      - name: Run Windows compile and test gate
        shell: pwsh
        run: .\scripts\verify-windows.ps1 -MinimumFreeGiB 8 -SkipPrerequisiteChecks
