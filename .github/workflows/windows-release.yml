name: Windows tagged release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-internal-alpha:
    name: Build unsigned internal Alpha
    # Keep enough workspace capacity for the debug quality gate plus release build.
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version and clean source
        shell: pwsh
        run: .\scripts\assert-release-version.ps1 -Tag "${{ github.ref_name }}" -RequireCleanGit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --prefix ui

      - name: Install locked Rust toolchain components
        shell: pwsh
        run: rustup toolchain install 1.97.1 --component rustfmt --component clippy

      - name: Verify build storage capacity
        shell: pwsh
        run: .\scripts\check-build-storage.ps1 -Mode Preflight -AutoCleanDev -MinimumFreeGiB 8 -EvidencePath artifacts/build-storage-preflight.validation.json

      - name: Test build storage guard
        shell: pwsh
        run: .\scripts\test-build-storage-gate.ps1

      - name: Scan repository secrets
        shell: pwsh
        run: .\scripts\scan-secrets.ps1

      - name: Test secret scanner
        shell: pwsh
        run: .\scripts\test-secret-scan.ps1

      - name: Verify synthetic fixture inventory
        shell: pwsh
        run: .\scripts\scan-private-fixtures.ps1 -SelfTest

      - name: Test update manifest policy
        shell: pwsh
        run: .\scripts\test-update-manifest-config.ps1

      - name: Test Concur build gate
        shell: pwsh
        run: .\scripts\test-concur-send-build-gate.ps1

      - name: Verify third-party licenses
        shell: pwsh
        run: .\scripts\check-third-party-licenses.ps1

      - name: Test release version tooling
        shell: pwsh
        run: .\scripts\test-release-version.ps1

      - name: Build OCR worker
        shell: pwsh
        run: cargo build -p invoice-parse --bin invoice-ocr-worker --locked

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Rust workspace
        shell: pwsh
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --workspace --all-targets --locked

      - name: Test forced OCR image path
        shell: pwsh
        run: cargo test -p invoice-parse offline_ocr_reads_synthetic_vat_invoice --locked -- --ignored

      - name: Test forced scanned PDF OCR path
        shell: pwsh
        run: cargo test -p invoice-parse scanned_pdf_ocr_reads_synthetic_vat_invoice --locked -- --ignored

      - name: Test production OCR worker roundtrip
        shell: pwsh
        run: cargo test -p invoice-assistant --test ocr_worker_process production_worker_roundtrips_image_and_scanned_pdf --locked -- --ignored --exact

      - name: Check UI types and Svelte diagnostics
        working-directory: ui
        run: npm run check

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Verify post-build storage reserve
        shell: pwsh
        run: .\scripts\check-build-storage.ps1 -Mode Postflight -AutoCleanDev -MinimumFreeGiB 8 -EvidencePath artifacts/build-storage-postflight.validation.json

      - name: Reclaim debug build space before release compilation
        shell: pwsh
        run: cargo clean --profile dev

      - name: Build minimal portable release assets
        shell: pwsh
        run: .\scripts\build-portable.ps1 -SkipVerify -MinimumFreeGiB 8

      - name: Verify packaged release without GUI automation
        shell: pwsh
        run: |
          $version = (Get-Content .\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $base = "InvoiceAssistant-$version-windows-x64-portable-UNSIGNED-INTERNAL-ALPHA"
          $zip = Join-Path $PWD "artifacts\$base.zip"
          .\scripts\verify-portable.ps1 `
            -ZipPath $zip `
            -ExpectedSignatureStatus NotSigned `
            -SkipLaunch `
            -EvidencePath (Join-Path $PWD "artifacts\portable-release.validation.json")

      - name: Stage release assets for the approval job
        uses: actions/upload-artifact@v4
        with:
          name: invoice-assistant-${{ github.ref_name }}-release-assets
          path: |
            artifacts/InvoiceAssistant-*-windows-x64-portable-UNSIGNED-INTERNAL-ALPHA.zip
            artifacts/InvoiceAssistant-*-windows-x64-portable-UNSIGNED-INTERNAL-ALPHA.zip.sha256
            artifacts/InvoiceAssistant-*-SBOM.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain internal release evidence
        uses: actions/upload-artifact@v4
        with:
          name: invoice-assistant-${{ github.ref_name }}-release-evidence
          path: artifacts/*.validation.json
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Create approved draft prerelease
    needs: build-internal-alpha
    runs-on: windows-2022
    timeout-minutes: 10
    environment: release-internal-alpha
    permissions:
      contents: write
    steps:
      - name: Checkout release notes from the tagged source
        uses: actions/checkout@v4

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: invoice-assistant-${{ github.ref_name }}-release-assets
          path: artifacts

      - name: Publish immutable version assets as a draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          $base = "InvoiceAssistant-$version-windows-x64-portable-UNSIGNED-INTERNAL-ALPHA"
          $zip = Join-Path $PWD "artifacts\$base.zip"
          $zipHash = "$zip.sha256"
          $sbom = Join-Path $PWD "artifacts\InvoiceAssistant-$version-SBOM.cdx.json"
          $notes = Join-Path $PWD "docs\release\RELEASE-NOTES-$version.md"

          foreach ($required in @($zip, $zipHash, $sbom)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Verified release asset is missing: $required"
            }
          }

          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release already exists for $tag; published versions are not overwritten"
          }

          $arguments = @(
            "release", "create", $tag,
            $zip, $zipHash, $sbom,
            "--verify-tag",
            "--draft",
            "--prerelease",
            "--title", "Invoice Assistant $version - unsigned internal Alpha"
          )
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            $arguments += @("--notes-file", $notes)
          }
          else {
            $arguments += "--generate-notes"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create GitHub draft prerelease for $tag"
          }
