[package]
name = "invoice-assistant"
version = "0.1.0"
description = "发票报销 AI 助手"
authors = ["Invoice Assistant Team"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-shell = "2.3.5"
# 文件选择对话框：webview 的 File 对象拿不到文件系统路径，必须走此插件
tauri-plugin-dialog = "2.7.2"
serde = { workspace = true }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

# 现有 workspace crates（S0.2 只做接线，命令实现在后续任务）
invoice-parse = { path = "../crates/invoice-parse" }
invoice-collect = { path = "../crates/invoice-collect" }
invoice-grouping = { path = "../crates/invoice-grouping" }
invoice-store = { path = "../crates/invoice-store" }

# D 输出模块
rust_xlsxwriter = "0.97"
rust_decimal = { workspace = true }
printpdf = "0.7"

[dev-dependencies]
# 仅测试用：构造 ParsedInvoice / ReportedInvoice 夹具校验 DTO 序列化

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
