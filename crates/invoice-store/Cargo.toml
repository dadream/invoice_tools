[package]
name = "invoice-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Database
rusqlite = { version = "0.27", features = ["bundled"] }

# Cryptography
aes-gcm = "0.10"
keyring = "3.6"
rand = "0.8"
base64 = "0.22"
dirs.workspace = true
sha2.workspace = true

# Serialization
serde.workspace = true
serde_json = "1"

# Decimal handling
rust_decimal.workspace = true

# Time handling
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
