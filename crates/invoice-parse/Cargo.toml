[package]
name = "invoice-parse"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
rust_decimal.workspace = true
serde.workspace = true
toml.workspace = true
quick-xml.workspace = true
zip.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
pdf-extract = "0.7"
lopdf = "0.34"
flate2 = "1.0"
regex = "1.11"
once_cell = "1.20"
image = "0.25"
serde_json = "1.0"
euclid = "0.20"
sha2 = "0.10"
paddle-ocr-rs = { version = "=0.6.1", default-features = false }
# 固定 ort RC；上游 paddle-ocr-rs 使用宽松的预发布版本范围，不能依赖解析时的“最新 RC”。
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
[target.'cfg(windows)'.dependencies]
dunce = "=1.0.5"
windows = { version = "=0.61.3", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
] }

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "invoice-parse"
path = "src/main.rs"

[[bin]]
name = "invoice-ocr-worker"
path = "src/bin/invoice-ocr-worker.rs"
